# =============================================================================
# FileBackupTool · nginx 配置样例（**内层一跳 + 子路径**形态）
#
# 适用条件（先确认是这一种，再抄）：
#   · 本机 nginx **不**终止 TLS —— 外层还有一台公网服务器终止 TLS，
#     再把它转发到本机的 80 端口；
#   · 要把本程序挂在**子路径**下（例如 /backup/），而不是占用根路径。
#
# 另一种形态（本机自己终止 TLS、域名与证书都在本机、挂根路径）
# 用同目录的 **nginx.conf.sample**，不要用这一份。
# 两份的转发头写法**必须不同**——抄错不是"少一层防护"，而是静默降级。
#
# 前提：前端必须是用 `publish.ps1 -PathBase /backup` 构建出来的。
#       根路径版的前端挂到子路径下会**白屏** —— 它的资源引用是 /assets/ 绝对路径，
#       而浏览器会去根路径找。
#
# 下面的两条 location 加进**已有的那个 server** 即可（通常是监听 80 的那个）：
# 不必新建 server、不用碰 server_name、不用碰证书，因此不会影响同机已有的其他服务。
#
# 完整背景与实测依据见 docs/plans/09-实现期修订.md §P。
# =============================================================================

# ---- ① 精确匹配：/backup 跳到 /backup/ ----
# location /backup/（带尾斜杠）**不匹配** /backup（不带斜杠），
# 而不匹配就会落到根 location（同机其他应用那里）。所以这一条必须有。
location = /backup {
    return 301 /backup/;
}

# ---- ② 主体：剥掉前缀转发给本程序 ----
location /backup/ {
    # 末尾这个 "/" 是关键：nginx 会把 /backup/ 换成 /，于是应用收到的
    # 还是它期望的根路径（/assets/…、/api/…、/hubs/events）。
    # 若写成 proxy_pass http://127.0.0.1:5000;（**不带**尾斜杠），
    # nginx 会把 /backup/… 原样传过去，应用不认识 → 一连串 404。
    proxy_pass http://127.0.0.1:5000/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # ⚠️ 透传外层的值，**不要**用 $proxy_add_x_forwarded_for / $scheme。
    #
    # 应用的 ForwardLimit 被硬编码为 1（Program.cs:393），只认 X-Forwarded-For
    # **最右**那一条（实测：两个条目时取最右）。追加了的话，头上是
    # `<客户端IP>, <外层服务器IP>`，应用取最右 → 它以为所有请求都来自外层服务器。
    # 后果两条，都不报错：
    #   · 登录限流退化成"全站共用一份 5 次/5 分钟"（外面一台机器打你，
    #     你自己反而登不进去）；
    #   · 应用永远看不到 https → 不下发 HSTS、Cookie 不带 Secure。
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ---- SignalR 的 WebSocket 升级 ----
    # 复用同机已有的那个 map（形如 `map $http_upgrade $connection_upgrade`），
    # 但**先核对它的内容**必须是：
    #     default upgrade;
    #     ''      close;
    # 若实际是 `default ""`，Connection 永远为空 → WebSocket 永远升不上去，
    # 而症状是**静默降级成轮询**：功能还在、不报错、"实时"却不再实时。
    # 拿不准就另起一个名字（如 $fbt_connection_upgrade）单独定义，别跟别的服务共用。
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;              # SignalR 长连接不能被缓冲
    proxy_read_timeout  3600s;        # 默认 60s 会掐断空闲的 WebSocket；
    proxy_send_timeout  3600s;        # 症状是"页面开着不动，徽章悄悄变成轮询"

    # ---- 可选（安全性权衡，不是必须）----
    # 透传 X-Forwarded-* 意味着任何能连到这层的人都**能伪造**这两个头，
    # 从而绕过按 IP 的登录限流（账户锁定仍然挡着：5 次错密码锁 15 分钟）。
    # 如果 /backup/ 只该给外层那台服务器访问，加上来源限制即可：
    #
    #     allow <外层服务器的IP>;
    #     allow 127.0.0.1;
    #     deny  all;
    #
    # 代价是你也没法直接 http://<内网IP>/backup/ 调试了。
}

# ---- ③ 本程序这一层不要下发 HSTS ----
# HSTS 由应用自己下发（appsettings.Production.json 的 ReverseProxy:UseHsts），
# 而应用是否"看到 https"取决于上面透传的 X-Forwarded-Proto。
# 这里再 add_header 一次会出现两个不同 max-age 的头，以后只会改一处。
